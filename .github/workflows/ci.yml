
name: CI Python Avancee

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:

  # JOB 1 : Analyse statique du code
  lint:
    name: Qualite du code
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v7

      - name: Installer Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Installer Ruff
        run: python -m pip install "ruff>=0.11,<1"

      - name: Analyser le code
        run: ruff check .


  # JOB 2 : Tests sur plusieurs versions
  tests:
    name: Tests Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v7

      - name: Installer Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Installer les dependances
        run: python -m pip install -r requirements.txt

      - name: Lancer pytest
        run: python -m pytest -v


  # JOB 3 : Validation finale
  validation:
    name: Validation finale
    runs-on: ubuntu-latest

    needs: [lint, tests]

    steps:
      - name: Confirmer le resultat
        run: echo "Tous les controles CI ont reussi"

  docker:
    name: Docker Build et Smoke Test
    runs-on: ubuntu-latest

    needs: [lint, tests]

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v7

      - name: Configurer Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Construire l'image Docker
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: python-cicd:test

      - name: Demarrer le conteneur
        run: |
          docker run -d \
            --name api-test \
            -p 127.0.0.1:8000:8000 \
            python-cicd:test

      - name: Verifier que l'API repond
        run: |
          python - <<'PY'
          import json
          import time
          import urllib.request

          url = "http://127.0.0.1:8000/addition?a=5&b=3"

          for attempt in range(30):
              try:
                  with urllib.request.urlopen(url, timeout=2) as response:
                      data = json.load(response)
                      assert response.status == 200
                      assert data["resultat"] == 8
                  print("Smoke test Docker reussi")
                  break
              except Exception:
                  if attempt == 29:
                      raise
                  time.sleep(1)
          PY

      - name: Afficher les logs Docker
        if: always()
        run: docker logs api-test || true
