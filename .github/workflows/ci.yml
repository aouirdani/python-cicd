
name: CI Python Avancee

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:

  # JOB 1 : Analyse statique du code
  lint:
    name: Qualite du code
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v7

      - name: Installer Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Installer Ruff
        run: python -m pip install "ruff>=0.11,<1"

      - name: Analyser le code
        run: ruff check .


  # JOB 2 : Tests sur plusieurs versions
  tests:
    name: Tests Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v7

      - name: Installer Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Installer les dependances
        run: python -m pip install -r requirements.txt

      - name: Lancer pytest
        run: python -m pytest -v


  # JOB 3 : Validation finale
  validation:
    name: Validation finale
    runs-on: ubuntu-latest

    needs: [lint, tests]

    steps:
      - name: Confirmer le resultat
        run: echo "Tous les controles CI ont reussi"
